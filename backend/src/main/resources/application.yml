server:
  port: 8080

spring:
  application:
    name: tracedelta
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TRACEDELTA_DB_URL}
    username: ${TRACEDELTA_DB_USER}
    password: ${TRACEDELTA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

tracedelta:
  security:
    master-key: ${TRACEDELTA_MASTER_KEY}
    jwt-secret: ${TRACEDELTA_JWT_SECRET}
    jwt-ttl-minutes: 720
  admin:
    password: ${TRACEDELTA_ADMIN_PASSWORD}
