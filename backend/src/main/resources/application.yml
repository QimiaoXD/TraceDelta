server:
  port: 8080

spring:
  application:
    name: tracedelta
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TRACEDELTA_DB_URL}
    username: ${TRACEDELTA_DB_USER}
    password: ${TRACEDELTA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${TRACEDELTA_REDIS_HOST:127.0.0.1}
      port: ${TRACEDELTA_REDIS_PORT:6379}
      timeout: 500ms
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

tracedelta:
  security:
    master-key: ${TRACEDELTA_MASTER_KEY}
    jwt-secret: ${TRACEDELTA_JWT_SECRET}
    jwt-ttl-minutes: 720
    ssrf:
      block-private-addresses: true
      allowed-hosts: ${TRACEDELTA_SSRF_ALLOWED_HOSTS:}
  trace:
    queue-capacity: 4096
    batch-size: 100
    flush-interval-ms: 500
    sync-fallback-on-full: true
    max-payload-chars: 32768
  admin:
    password: ${TRACEDELTA_ADMIN_PASSWORD}
  runner:
    global-max-concurrency: 64
    default-concurrency: 8
    default-max-attempts: 3
    default-request-timeout-ms: 30000
    default-rate-limit-per-sec: 20.0
    default-rate-limit-burst: 20
    default-retry-base-delay-ms: 250
    default-retry-max-delay-ms: 4000
    redis-rate-limit-enabled: true
    recovery-on-startup: true
