spring:
  datasource:
    url: jdbc:h2:mem:td;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

tracedelta:
  security:
    # 32-byte zeroed test key (Base64) - test profile only
    master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    jwt-secret: test-jwt-secret-key-with-at-least-32-characters-0001
    jwt-ttl-minutes: 60
  admin:
    password: test-admin-pass
