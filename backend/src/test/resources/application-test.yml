spring:
  datasource:
    url: jdbc:h2:mem:td;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

tracedelta:
  security:
    # 32-byte zeroed test key (Base64) - test profile only
    master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    jwt-secret: test-jwt-secret-key-with-at-least-32-characters-0001
    jwt-ttl-minutes: 60
  admin:
    password: test-admin-pass
  runner:
    global-max-concurrency: 32
    default-concurrency: 8
    default-max-attempts: 3
    default-request-timeout-ms: 10000
    default-rate-limit-per-sec: 1000.0
    default-rate-limit-burst: 1000
    default-retry-base-delay-ms: 20
    default-retry-max-delay-ms: 100
    redis-rate-limit-enabled: false
    recovery-on-startup: false

management:
  health:
    redis:
      enabled: false
